[project]
name = "rule-of-5-visualiser"
version = "0.1.0"
description = "A statistical visualiser for the Rule of Five heuristic."
authors = [
    {name = "Asif Sayyed",email = "asifdotexe@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.4.4,<3.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "gradio (>=6.12.0,<7.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=6.1.1,<7.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)"
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = ["fixme"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
